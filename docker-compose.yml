services:
  postgres_hospital:
    image: postgres:16-alpine
    container_name: postgres_hospital
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: always
    volumes:
      - postgres_hospital_data:/var/lib/postgresql/data
    ports:
      - "$DB_FORWARD_PORT:${DB_PORT}"

    networks:
      - hospital_network

  pgadmin-hospital:
    container_name: pg-admin-hospital
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_FORWARD_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_hospital
    networks:
      - hospital_network
    configs:
      - source: pgadmin_config
        target: /pgadmin4/servers.json
        mode: 0444
      - source: pgadmin_pass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400

volumes:
  postgres_hospital_data:
  pgadmin_data:

networks:
  hospital_network:
    driver: bridge

configs:
  pgadmin_config:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Hospital Postgres",
            "Group": "Servers",
            "Host": "postgres_hospital",
            "Port": ${DB_PORT},
            "MaintenanceDB": "${DB_NAME}",
            "Username": "${DB_USER}",
            "PassFile": "/config/pgpass",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin_pass:
    content: |
      hospital_postgres:${DB_PORT}:${DB_NAME}:${DB_USER}:${DB_PASSWORD}
