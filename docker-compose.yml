services:
  postgres_hospital:
    image: postgres:16-alpine
    container_name: postgres_hospital
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: always
    volumes:
      - postgres_hospital_data:/var/lib/postgresql/data
      - ./backend/databaseConfig.sql:/docker-entrypoint-initdb.d/01_databaseConfig.sql:ro
    ports:
      - "$DB_FORWARD_PORT:${DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - hospital_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres_hospital
      DB_PORT: "5432"
      DB_FORWARD_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "40000:40000"
    depends_on:
      postgres_hospital:
        condition: service_healthy
    networks:
      - hospital_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      FRONTEND_PORT: "40100"
      PUBLIC_API_URL: "http://localhost:40000"
    ports:
      - "40100:40100"
    depends_on:
      - backend
    networks:
      - hospital_network

  pgadmin-hospital:
    container_name: pg-admin-hospital
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_FORWARD_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_hospital
    networks:
      - hospital_network
    configs:
      - source: pgadmin_config
        target: /pgadmin4/servers.json
        mode: 0444
      - source: pgadmin_pass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400

volumes:
  postgres_hospital_data:
  pgadmin_data:

networks:
  hospital_network:
    driver: bridge

configs:
  pgadmin_config:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Hospital Postgres",
            "Group": "Servers",
            "Host": "postgres_hospital",
            "Port": ${DB_PORT},
            "MaintenanceDB": "${DB_NAME}",
            "Username": "${DB_USER}",
            "PassFile": "/config/pgpass",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin_pass:
    content: |
      postgres_hospital:${DB_PORT}:${DB_NAME}:${DB_USER}:${DB_PASSWORD}